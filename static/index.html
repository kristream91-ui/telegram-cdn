<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ani77 — Stream Hindi Dub Anime</title>
  <meta name="description" content="Stream Hindi dub anime straight from Telegram.">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <nav id="nav">
    <a class="brand" href="#/" title="Ani77 — Home">
      <img src="/static/logo.webp" alt="Ani77">
    </a>
    <div class="nav-search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line>
      </svg>
      <input id="search" type="search" placeholder="Search anime, movies..." autocomplete="off">
    </div>
    <div class="nav-actions">
      <button id="addBtn" class="btn ghost" title="Add a file by Telegram file_id">
        <span class="plus">+</span> Add
      </button>
    </div>
  </nav>

  <main id="app"></main>

  <footer id="footer">
    <img src="/static/logo.webp" alt="">
    <p>Stream Hindi Dub Anime Free · Powered by Telegram</p>
  </footer>

  <div id="toast" class="toast hidden" role="status"></div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2>Add to Ani77</h2>
      <p class="hint">Paste a Telegram <b>file_id</b> — the app auto-detects size, format and codecs. MP4 and TS videos are supported.</p>
      <label>file_id <span class="req">*</span></label>
      <input id="fidInput" placeholder="BQACAgUAAxkB..." spellcheck="false">
      <label>Name (with extension, e.g. Movie.mp4)</label>
      <input id="nameInput" placeholder="Tensura S4E1 Hindi Dub.mp4">
      <label>Size in bytes (optional)</label>
      <input id="sizeInput" type="number" min="0" placeholder="224000000">
      <label>Mime type (optional)</label>
      <input id="mimeInput" placeholder="video/mp4">
      <div id="addStatus" class="add-status hidden"></div>
      <div class="modal-actions">
        <button id="cancelAdd" class="btn ghost">Cancel</button>
        <button id="confirmAdd" class="btn primary">Detect & Add</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
