<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamVault — Telegram CDN</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/">Stream<span>Vault</span></a>
  <div class="searchbox">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
    </svg>
    <input id="search" type="search" placeholder="Search movies, music, files…" autocomplete="off">
  </div>
  <button id="addBtn" class="btn ghost" title="Add by Telegram file ID">＋ Add</button>
</header>

<main id="app"></main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3>Add a file by Telegram File ID</h3>
    <p class="hint">Send any file to the bot on Telegram — it replies with links, or paste
      its <code>file_id</code> here. The file_id must come from <em>this</em> bot.</p>
    <input id="fidInput"  placeholder="file_id (BAACAgUAAx…)">
    <input id="nameInput" placeholder="Display name (optional)">
    <input id="sizeInput" type="number" min="0" placeholder="File size in bytes (optional — enables seeking)">
    <input id="mimeInput" placeholder="MIME type, e.g. video/mp4 (optional)">
    <div class="row">
      <button id="cancelAdd" class="btn ghost">Cancel</button>
      <button id="confirmAdd" class="btn primary">Add file</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/static/app.js"></script>
</body>
</html>
